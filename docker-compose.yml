services:
  # --- 1. Servicio de Base de Datos ---
  # Se queda casi igual, pero le damos un nombre de host predecible
  postgres-db:
    image: postgres:15-alpine
    container_name: states_municipalities_db
    hostname: postgres-db # <-- Nombre de host explícito
    restart: always
    environment:
      # Estas variables las usará el contenedor de Postgres para inicializarse
      POSTGRES_USER: ${POSTGRES_USER:-admin_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin_password}
      POSTGRES_DB: ${POSTGRES_DB:-states_municipalities_db}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  # --- 2. Servicios de la API (Tus 3 réplicas) ---
  # Ahora usan el Dockerfile de TS y variables de entorno separadas
  api-1:
    build: . # Construye la imagen usando el Dockerfile en esta carpeta
    container_name: api-1
    restart: always
    expose:
      - "3000" # El puerto interno que definimos en el Dockerfile
    depends_on:
      - postgres-db # No inicies hasta que la BD esté lista
    environment:
      # Estas variables las usará TypeORM (data-source.ts) para conectarse
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-admin_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin_password}
      POSTGRES_DB: ${POSTGRES_DB:-states_municipalities_db}
      PORT: 3000 # El puerto en el que correrá la app (server.ts)

  api-2:
    build: .
    container_name: api-2
    restart: always
    expose:
      - "3000"
    depends_on:
      - postgres-db
    environment:
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-admin_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin_password}
      POSTGRES_DB: ${POSTGRES_DB:-states_municipalities_db}
      PORT: 3000

  api-3:
    build: .
    container_name: api-3
    restart: always
    expose:
      - "3000"
    depends_on:
      - postgres-db
    environment:
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-admin_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin_password}
      POSTGRES_DB: ${POSTGRES_DB:-states_municipalities_db}
      PORT: 3000

  # --- 3. Servicio de Nginx (La Puerta de Entrada) ---
  # Este archivo no necesita ningún cambio
  nginx:
    image: nginx:alpine
    container_name: reverse-proxy
    ports:
      - "80:80" # El único puerto expuesto a tu laptop
    volumes:
      # Montamos nuestra configuración de Nginx
      - ./nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api-1
      - api-2
      - api-3

volumes:
  postgres-data: # Define el volumen de la BD

